[project]
site_name = "MuseDashMirror"
site_description = "Guides for building Muse Dash mods with MuseDashMirror."
site_url = "https://mdmods.github.io/MuseDashMirror/"
repo_url = "https://github.com/MDMods/MuseDashMirror"
repo_name = "MDMods/MuseDashMirror"
edit_uri = "edit/main/docs/"
docs_dir = "docs"
site_dir = "site"
nav = [
    { "Home" = "index.md" },
    { "Guides" = [
        { "Introduction" = "introduction.md" },
        { "Getting Started" = "getting-started.md" },
        { "Events and Scenes" = "events-and-scenes.md" },
        { "Source Generators" = "source-generators.md" },
        { "Game Data" = "game-data.md" },
        { "UI Components" = "ui-components.md" },
        { "Utilities and Extensions" = "utilities-and-extensions.md" },
        { "Troubleshooting" = "troubleshooting.md" },
    ] },
]

[project.extra]
generator = false

[project.theme]
language = "en"
features = [
    "content.action.edit",
    "content.action.view",
    "content.code.copy",
    "navigation.footer",
    "navigation.instant",
    "navigation.path",
    "navigation.sections",
    "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions.pymdownx.quotes]
callouts = true

[project.markdown_extensions.pymdownx.superfences]
